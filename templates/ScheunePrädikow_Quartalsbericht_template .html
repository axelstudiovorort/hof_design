document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tter-spacing:-0.01em;line-height:1.1;\">Quartalsbericht<\u002Fdiv>\n        <div style=\"color:#00aad6;font-family:'GT-Sectra-Fine',Georgia,serif;font-weight:500;font-size:21px;\">Scheune Prädikow<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"text-align:center;font-size:12.5px;line-height:1.4;color:#6b6560;max-width:540px;margin:0 auto;\">\n        Wir berichten viermal im Jahr über den Stand der Dinge. Diesmal etwas verkürzt, weil die Sommerpause vor der Tür steht.\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:5px;margin-top:2px;\">\n        <div style=\"font-weight:700;font-size:12.5px;\">Zusammenfassung für die, die wenig Zeit haben:<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:150px 1fr;gap:3px 10px;font-size:12px;\">\n          <div style=\"font-weight:700;color:#00aad6;\">Fun 😊<\u002Fdiv><div>(Stimmung im Team)<\u002Fdiv>\n          <div style=\"font-weight:700;color:#00aad6;\">Fame 🙌<\u002Fdiv><div>(Wahrnehmung von Außen)<\u002Fdiv>\n          <div style=\"font-weight:700;color:#00aad6;\">Fortune 💰<\u002Fdiv><div>(Finanzen)<\u002Fdiv>\n          <div style=\"font-weight:700;color:#00aad6;\">Framework 🛠️<\u002Fdiv><div>(Rahmenbedingungen und Fortschritt)<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:6px;flex:1;min-height:0;\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:12px;line-height:1.4;\">\n          <div>\n            <div style=\"font-family:'GT-Sectra-Fine',Georgia,serif;font-weight:500;font-size:14px;margin-bottom:5px;\">Veranstaltungen Rückblick<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px;\">\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>Tag der offenen Ateliers mit viele Besucher*innen, leckeres Essen, kalte Drinks und ein Top-Team.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>Nachmal ein dickes Dankeschön an Anke W. und Fraenze für die Gesamtkoordination im Storch und die Künstler*innen fürs ausrichten.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>Workshops im Rahmen der Next-Gen Narratives mit treibender Kraft Malika.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>Schöne, warme Sonntagscafé Nachmittage. Lieben Dank Birgit und Heike P.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>Bosch-Alumni-Event, ein ganzes Wochenende mit eigenem Catering und Programm, Dank an Christin &amp; Team!<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>und weiteres: ein Tag der Baukultur, Simonas Geburtstag, ein Konzertabend von Tille, die Tagungsklausur der AWO, VM-Abende und so weiter.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:5px;\">Unser Programm bleibt bunt!<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'GT-Sectra-Fine',Georgia,serif;font-weight:500;font-size:14px;margin-bottom:5px;\">Veranstaltungen Ausblick<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px;\">\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>Der geplante Pop-up mit Piqnique muss leider ausfallen, aber steht noch einiges an…<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>Offizieller Start 2. Jahreshälfte mit einem sommerlichen Cocktailabend am 28.08 von Sven und Birgit J.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>Abschlussfestival Young Narratives<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>29. August: Ede&amp;Unku, Lesung und Konzert<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:5px;\">Im Dezember wird es erneut einen Kurzfilmabend geben, ab September finden dann auch regelmäßig wieder Jam Sessions, Kneipenabende, Hofführungen und Flohmärkte statt. Über tatkräftige Unterstützung hinter der Bar und im Saal freuen wir uns!<\u002Fdiv>\n            <div style=\"margin-top:5px;\">Falls jemand unsere Veranstaltungsvielfalt ergänzen möchte, melde dich gern. Das Scheunenteam steht mit Rat und Tat zur Verfügung.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:12px;line-height:1.4;\">\n          <div>\n            <div style=\"font-family:'GT-Sectra-Fine',Georgia,serif;font-weight:500;font-size:14px;margin-bottom:5px;\">Team<\u002Fdiv>\n            <div>Wir wurden von euch gewählt, hurra! Wir haben uns als Ziel gesetzt, innerhalb des ersten Sommer 2027 unsere Struktur zu klären. Wir haben, so wie alle Kreise, Rollen für unsere Domäne ausgearbeitet.<\u002Fdiv>\n            <div style=\"margin-top:5px;\">Kreisleitung übernimmt Jene, Suse gemeinsam mit den Themenkreis Dorf und Region, Robert kümmert sich weiterhin um den Hof. Moderation und Protokoll.<\u002Fdiv>\n            <div style=\"margin-top:5px;\">Die Stimmung im Team ist gut. Nach anfänglichen Startschwierigkeiten und Zusammenarbeit, vielen Erfolgen, ein paar herausfordernden Missverständnissen, steht die Scheune nun gut aufgestellt da.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'GT-Sectra-Fine',Georgia,serif;font-weight:500;font-size:14px;margin-bottom:5px;\">Was haben wir geschafft?<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px;\">\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>Kreisstruktur etabliert<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>Scheune stabiler denn je: Der Breitband-Vertrag verträgt inzwischen auch Rückschläge<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>Strategietreffen durchgeführt<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>monatliche Treffen mit dem Dorf – gemeinsam<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>endlich eine Reinigungsroutine, die sich selbst baut<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'GT-Sectra-Fine',Georgia,serif;font-weight:500;font-size:14px;margin-bottom:5px;\">Was steht bis Ende des Jahres an?<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px;\">\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>geplante Investitionen tätigen, die den Hof stützen und erweitern<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:6px;\"><span style=\"color:#f05e29;\">–<\u002Fspan><span>den Betrieb der Scheune weiterhin verteilen und in die Kreis-Struktur einbinden<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"02 Finanzen\" style=\"background:#f9f5f1;font-family:'Europa',system-ui,sans-serif;color:#1a1919;\">\n  <div style=\"height:100%;width:100%;box-sizing:border-box;padding:22px;\">\n    <div style=\"height:100%;width:100%;box-sizing:border-box;border:2px solid #f05e29;padding:30px 36px;display:flex;flex-direction:column;gap:12px;overflow:hidden;\">\n\n      <div style=\"text-align:center;display:flex;flex-direction:column;gap:2px;\">\n        <div style=\"color:#00aad6;font-family:'GT-Sectra-Fine',Georgia,serif;font-weight:700;font-size:25px;letter-spacing:-0.01em;\">{{ quarterRange }}<\u002Fdiv>\n        <div style=\"color:#00aad6;font-family:'GT-Sectra-Fine',Georgia,serif;font-weight:700;font-size:25px;letter-spacing:-0.01em;\">Finanzen<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-weight:700;font-size:13px;\">Übersicht<\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1.3fr 0.85fr 0.85fr;gap:14px;align-items:stretch;\">\n        <image-slot id=\"chart-cashflow\" shape=\"rect\" style=\"width:100%;height:130px;\" placeholder=\"Cashflow-Chart einfügen\"><\u002Fimage-slot>\n        <div style=\"border:1px solid #f05e29;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;\">\n          <div style=\"font-size:11px;color:#6b6560;\">Allgemeiner Cashflow gesamt (EUR)<\u002Fdiv>\n          <div style=\"font-size:22px;font-weight:800;color:#00aad6;\">34.051<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #f05e29;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;\">\n          <div style=\"font-size:11px;color:#6b6560;\">Ausgaben gesamt (EUR)<\u002Fdiv>\n          <div style=\"font-size:22px;font-weight:800;color:#00aad6;\">35.211<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;\">\n        <div style=\"display:flex;gap:12px;align-items:center;\">\n          <image-slot id=\"chart-pie-income\" shape=\"circle\" style=\"width:110px;height:110px;flex:none;\" placeholder=\"Kreisdiagramm Einnahmen\"><\u002Fimage-slot>\n          <div style=\"display:flex;flex-direction:column;gap:2px;font-size:10.5px;\">\n            <div style=\"font-weight:700;margin-bottom:2px;\">Einnahmen nach Kategorie (EUR)<\u002Fdiv>\n            <div>9.000 · 26% · Coworking<\u002Fdiv>\n            <div>5.112 · 15% · Bosch Alumni<\u002Fdiv>\n            <div>4.950 · 15% · CoWorking 2<\u002Fdiv>\n            <div>3.863 · 11% · Vermietung Rückzahlung<\u002Fdiv>\n            <div>11.026 · 33% · Sonstige Events<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:center;\">\n          <image-slot id=\"chart-pie-expense\" shape=\"circle\" style=\"width:110px;height:110px;flex:none;\" placeholder=\"Kreisdiagramm Ausgaben\"><\u002Fimage-slot>\n          <div style=\"display:flex;flex-direction:column;gap:2px;font-size:10.5px;\">\n            <div style=\"font-weight:700;margin-bottom:2px;\">Ausgaben nach Kategorie (EUR)<\u002Fdiv>\n            <div>2.310 · 27% · Betriebskosten<\u002Fdiv>\n            <div>1.417 · 17% · Instandhaltung<\u002Fdiv>\n            <div>840 · 10% · Verwaltung<\u002Fdiv>\n            <div>805 · 9% · Diverses<\u002Fdiv>\n            <div>3.211 · 37% · Sonstiges<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:11.5px;line-height:1.4;color:#1a1919;\">\n        Die Grafik zeigt die Gegenüberstellung von erwarteten Einnahmen zu erwarteten Ausgaben. Der Cashflow ist zum Ende des Jahres positiv, d.h. die Scheune wird wahrscheinlich einen Gewinn erzielen. Der hohe Wert am Anfang des Jahres bei ca. 18.000€ erklärt sich mit den Überschüssen des Jahres 2025 für laufende Rechnungen im laufenden Jahr.\n      <\u002Fdiv>\n      <div style=\"font-size:11.5px;font-weight:700;\">Was bedeutet dieser Abfall und Anstieg zum Ende des Jahres?<\u002Fdiv>\n      <div style=\"font-size:11.5px;line-height:1.4;\">\n        Der Abfall sind die großen Zahlungen wie Pacht an die trias und Rückzahlung des Kredits. Der folgende steile Anstieg ist keine überschwängliche Hoffnung, sondern alle offene Rechnungen im Coworking, die auf Ende des Jahres gestellt sind. Hintergrund ist, dass wir für die Mieter:innen Dauermietrechnung ausstellen, die das gesamte Jahr umfassen. Das verringert unseren Aufwand.\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:center;\">\n        <image-slot id=\"chart-iban\" shape=\"rect\" style=\"width:100%;height:100px;\" placeholder=\"Zahlungen laut IBAN einfügen\"><\u002Fimage-slot>\n        <div style=\"display:flex;gap:14px;justify-content:space-around;text-align:center;\">\n          <div><div style=\"font-size:10.5px;color:#6b6560;\">Eingang<\u002Fdiv><div style=\"font-size:15px;font-weight:800;\">66.716<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:10.5px;color:#6b6560;\">Ausgang<\u002Fdiv><div style=\"font-size:15px;font-weight:800;\">-51.282<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:10.5px;color:#6b6560;\">Cashflow<\u002Fdiv><div style=\"font-size:15px;font-weight:800;color:#00aad6;\">15.434<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:11.5px;line-height:1.4;\">\n        Oben die Übersicht zum Gesamtjahr: Wir erwarten etwa 15.000€ positiven Cashflow, aber das ist nicht der Gewinn, da wir hohe Überschüsse aus dem Vorjahr mitschleppen. Da werden wenige Einnahmen dazu kommen. Wir rechnen da bisher sehr konservativ. Dabei muss aber bedacht sein, dass dieses Ziel gerade nur mit Ehrenamt erreicht wird. Das wollen wir aber mittelfristig ändern.\n      <\u002Fdiv>\n      <div style=\"font-size:11.5px;font-weight:700;\">Warum sind die Zahlen so viel besser als noch zu Ende des Q1?<\u002Fdiv>\n      <div style=\"font-size:11.5px;line-height:1.4;\">\n        Wir haben im zweiten Quartal sehr viel mehr akquiriert als in Q1: Coworking, ein neuer Kurs, mehr Zuschüsse von der Gemeinde, das Bosch-Alumni wurde aufgestockt und last but not least: der CoWorking-Space am Sonntag sorgt für den steten Tropfen.\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"03 Events\" style=\"background:#f9f5f1;font-family:'Europa',system-ui,sans-serif;color:#1a1919;\">\n  <div style=\"height:100%;width:100%;box-sizing:border-box;padding:22px;\">\n    <div style=\"height:100%;width:100%;box-sizing:border-box;border:2px solid #f05e29;padding:30px 36px;display:flex;flex-direction:column;gap:14px;overflow:hidden;\">\n\n      <div style=\"text-align:center;display:flex;flex-direction:column;gap:2px;\">\n        <div style=\"color:#00aad6;font-family:'GT-Sectra-Fine',Georgia,serif;font-weight:700;font-size:25px;letter-spacing:-0.01em;\">{{ quarterRange }}<\u002Fdiv>\n        <div style=\"color:#00aad6;font-family:'GT-Sectra-Fine',Georgia,serif;font-weight:700;font-size:25px;letter-spacing:-0.01em;\">Auswertung der Events<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:12px;line-height:1.4;\">Hier die Detail-Übersicht über die verschiedenen Arten der Einnahmen:<\u002Fdiv>\n\n      <image-slot id=\"chart-events\" shape=\"rect\" style=\"width:100%;flex:1;min-height:0;\" placeholder=\"Events-Tabelle / Balkendiagramm einfügen\"><\u002Fimage-slot>\n\n      <div style=\"font-size:11.5px;line-height:1.45;\">\n        Unser Nutzungsmix ist stabil. Die Einnahmen verteilen sich auf verschiedene Angebote, sodass den Wegfall einer Säule verkraften könnten. Dabei machen Kurse und CoWorking wenig Arbeit für einen steten Cashflow. Auch deswegen können wir die hofeigenen Veranstaltungen, Cafés und Jams mit WoManPower unterstützen. Dazu erwirtschaften so auch ein Kulturbudget, um z.B. den Alltag zu finanzieren. Das gibt uns die Freiheit, Formate anzubieten, die nicht auf Wirtschaftlichkeit setzen müssen. Satzungsziele olé.\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdoc-page>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:794,&quot;height&quot;:1123},&quot;quarterBadge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;02/2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;quarterRange&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Quartal 01-02/26&quot;,&quot;tsType&quot;:&quot;string&quot;}}\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
